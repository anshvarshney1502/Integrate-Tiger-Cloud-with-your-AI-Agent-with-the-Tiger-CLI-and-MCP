[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiger-agent"
version = "1.0.0"
description = "Integrate Tiger Cloud with your AI Agent using Tiger CLI and Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ansh Varshney"}
]
keywords = [
    "tiger-cloud",
    "timescaledb",
    "postgresql",
    "mcp",
    "model-context-protocol",
    "ai-agent",
    "claude",
    "antigravity",
    "cursor",
    "time-series"
]

[project.scripts]
tiger-agent = "tiger_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
